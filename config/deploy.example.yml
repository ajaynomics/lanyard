# An example destination. An install copies this to config/deploy.<name>.yml,
# and .kamal/secrets.example to .kamal/secrets.<name>, then fills in its own
# host, address, sign-in and names (docs/deployments.md). The template deploys
# nothing itself; this file exists to be copied and to be checked by
# test/production_deploy_config_test.rb like any destination.
#
# A destination that must never be deployed by accident (production) names the
# variable that allows it:
#
#   x-express: MYAPP_PRODUCTION_EXPRESS
#
# The hooks then refuse it unless the deploy runs with that variable set to 1.
# Rollback is exempt. test/deploy_gate_test.rb runs both hooks.
#
# To keep the names a running deployment already has (its containers and
# volume), set them here; they override config/deploy.yml:
#
#   service: myapp
#   image: myapp
#   volumes:
#     - "myapp_storage:/rails/storage"
servers:
  web:
    hosts:
      - server.example.com
    options:
      # How the sidecar reaches Rails (AGENT_RAILS_URL below): <service>-web.
      network-alias: durable_assistants-web
      # Matching memory-swap so Docker cannot swap past the cap: a slow
      # container nobody can explain is worse than a killed one.
      # test/production_deploy_config_test.rb holds it.
      memory: 1g
      memory-swap: 1g
    env:
      clear:
        OTEL_SERVICE_NAME: durable_assistants
        # Says which destination a span came from, when several send to one
        # collector. Set OTEL_EXPORTER_OTLP_ENDPOINT to export at all.
        OTEL_RESOURCE_ATTRIBUTES: deployment.destination=example
        RAILS_ENV: production
        DEPLOYMENT_ENVIRONMENT: production
        RAILS_LOG_LEVEL: info
        # bin/falcon binds PORT, and kamal-proxy sends traffic to 80.
        PORT: "80"
        # The deployment's name on its screens, and the name connected
        # services see.
        APP__NAME: Assistants
        APP__URL: https://assistants.example.com
        # Any OpenID Connect provider (README.md, Signing in). Web and job
        # both need the client; its id and secret are in the secrets below.
        OIDC__ISSUER: https://id.example.com
        OIDC__CALLBACK_URI: https://assistants.example.com/auth/ajent/callback
        ACCESS__EMAILS: someone@example.com
        PI_DURABLE__SIDECAR_URL: unix:///rails/storage/agent/sidecar.sock
        # An agent's computer is a Sprite (docs/agent.md). Each Sprite's name
        # starts with this prefix.
        PI_DURABLE__COMPUTERS: sprites
        PI_DURABLE__SPRITE_PREFIX: assistants
      secret:
        - RAILS_MASTER_KEY
        - OIDC__CLIENT_ID
        - OIDC__CLIENT_SECRET
        - PI_DURABLE__SIDECAR_TOKEN
        - PI_DURABLE__RAILS_TOKEN
        # The office's keys for its agents (docs/office.md), each made in its
        # service after the office's first deploy: until it exists, leave its
        # line out here and in the secrets file, and that part stays off.
        - CAMPFIRE__ADMIN_EMAIL
        - CAMPFIRE__ADMIN_PASSWORD
        - PASSBOLT__PRIVATE_KEY
        - PASSBOLT__PASSPHRASE
        - WIKI__API_KEY
        - CRM__API_KEY

  # Solid Queue runs here and nowhere else. Falcon has no in-process worker,
  # so without this role the recurring jobs in config/recurring.yml never
  # execute -- and the first perform_later enqueues and sits forever with no
  # error. Same host and the same storage volume as web, which is what makes
  # one SQLite queue database work across two containers: two processes, one
  # inode, WAL and a busy timeout.
  job:
    hosts:
      - server.example.com
    proxy: false
    cmd: bin/jobs
    options:
      memory: 512m
      memory-swap: 512m
    env:
      clear:
        # bin/jobs boots the whole application, so production_secrets.rb runs
        # here too and this role needs every value the web role needs.
        OTEL_SERVICE_NAME: durable_assistants
        OTEL_RESOURCE_ATTRIBUTES: deployment.destination=example
        RAILS_ENV: production
        DEPLOYMENT_ENVIRONMENT: production
        RAILS_LOG_LEVEL: info
        APP__NAME: Assistants
        APP__URL: https://assistants.example.com
        OIDC__ISSUER: https://id.example.com
        OIDC__CALLBACK_URI: https://assistants.example.com/auth/ajent/callback
        ACCESS__EMAILS: someone@example.com
        PI_DURABLE__SIDECAR_URL: unix:///rails/storage/agent/sidecar.sock
        PI_DURABLE__COMPUTERS: sprites
        PI_DURABLE__SPRITE_PREFIX: assistants
      secret:
        - RAILS_MASTER_KEY
        - OIDC__CLIENT_ID
        - OIDC__CLIENT_SECRET
        - PI_DURABLE__SIDECAR_TOKEN
        - PI_DURABLE__RAILS_TOKEN
        # The office's keys for its agents (docs/office.md), each made in its
        # service after the office's first deploy: until it exists, leave its
        # line out here and in the secrets file, and that part stays off.
        - CAMPFIRE__ADMIN_EMAIL
        - CAMPFIRE__ADMIN_PASSWORD
        - PASSBOLT__PRIVATE_KEY
        - PASSBOLT__PASSPHRASE
        - WIKI__API_KEY
        - CRM__API_KEY

  # The Pi Durable sidecar (docs/agent.md), its own process beside web and
  # job: same host, same storage volume, where its retained store lives. No
  # proxy and no published port: Rails reaches it only through the Unix socket
  # bin/agent-container serves on that volume. Its callbacks reach Rails by
  # the web role's network alias.
  agent:
    hosts:
      - server.example.com
    proxy: false
    cmd: bin/agent-container
    options:
      memory: 768m
      memory-swap: 768m
    env:
      clear:
        OTEL_SERVICE_NAME: durable_assistants-agent
        OTEL_RESOURCE_ATTRIBUTES: deployment.destination=example
        AGENT_SOCKET: /rails/storage/agent/sidecar.sock
        AGENT_RAILS_URL: http://durable_assistants-web
        DEPLOYMENT_ENVIRONMENT: production
        # Model accounts are signed in at /subscriptions and kept here,
        # encrypted with SUBSCRIPTION_VAULT_KEY (docs/agent.md) and sealed to
        # this install's name and vault scope: changing either means signing
        # in again. The scope is pinned so DEPLOYMENT_ENVIRONMENT can change.
        AGENT_APPLICATION: assistants
        SUBSCRIPTION_VAULT_SCOPE: production
        CLAUDE_SUBSCRIPTION_FILE: /rails/storage/agent/claude-subscription.json
        CHATGPT_SUBSCRIPTION_FILE: /rails/storage/agent/chatgpt-subscription.json
        # Each conversation's computer: a Sprite from the agent image
        # (Dockerfile.agent, published by .gitea/workflows/ci.yml),
        # pinned by commit.
        SPRITES_URL: https://sprites.example.com
        SPRITES_IMAGE: registry.example.com/durable-assistants-agent:<commit>
      # bin/agent hands these to Node, and nothing else of the app's.
      secret:
        - PI_DURABLE__SIDECAR_TOKEN
        - PI_DURABLE__RAILS_TOKEN
        - SUBSCRIPTION_VAULT_KEY
        - SPRITES_TOKEN

proxy:
  host: assistants.example.com
  # Behind a Cloudflare Tunnel, which terminates TLS and forwards plain HTTP to
  # the host's kamal-proxy. app_port is omitted: the web role's PORT puts
  # Falcon on kamal-proxy's default of 80.
  ssl: false
  run:
    bind_ips:
      - 127.0.0.1
  forward_headers: true
  healthcheck:
    path: /up

registry:
  server: registry.example.com
  username: durable_assistants
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  # The docker-container builder would otherwise attach a provenance
  # attestation manifest to every push.
  provenance: false

ssh:
  user: deploy

# The office (docs/office.md): chat, wiki, code, CRM and vault, where the
# install's people and agents work together. Every install runs it. Each
# service is pinned by version and digest; updating the template may bump
# them, so an install reads `git diff <old> <new> -- config/deploy.example.yml`
# at every update. Keep these accessory names: the app finds each service at
# http://<service>-<accessory> inside the host, and Kamal finds the running
# containers by them.
#
# People reach each at its own address, which may sit behind their sign-in
# page (Cloudflare Access, say); the app and its agents never use those
# addresses. Named volumes, prefixed with the service like the app's: Docker
# names them host-wide, and `kamal accessory remove` leaves volumes where it
# deletes directories.

# Twenty runs its upgrade commands before it listens, which takes over a
# minute; Kamal's default 30 seconds fails its boot. Only failures wait longer.
deploy_timeout: 180

accessories:
  # The vault: saved sign-ins (docs/passwords.md). Passbolt keeps its data in
  # MariaDB, the database its image is set up for; SQLite is not one it
  # supports. The gpg volume holds the server's key: lose it and everyone sets
  # up again.
  passbolt-db:
    image: docker.io/library/mariadb:11.8@sha256:c4124d1afa875e47f2892edf26b482fa54f796e2f342d3717a04ca091a22a9bd
    host: server.example.com
    env:
      clear:
        MARIADB_RANDOM_ROOT_PASSWORD: "true"
        MARIADB_DATABASE: passbolt
        MARIADB_USER: passbolt
      secret:
        - MARIADB_PASSWORD:PASSBOLT_DB_PASSWORD
    volumes:
      - durable_assistants_passbolt_mysql:/var/lib/mysql
  passbolt:
    image: docker.io/passbolt/passbolt:5.17.0-1-ce@sha256:e076a26c92a542f075dd138a78b8c5dea3361156383aa0a18c7dd8cdb3aff44f
    host: server.example.com
    proxy:
      host: vault.example.com
      app_port: 80
      ssl: false
      healthcheck:
        path: /healthcheck/status
    env:
      clear:
        APP_FULL_BASE_URL: https://vault.example.com
        # TLS ends in front of kamal-proxy, as for the app.
        PASSBOLT_SSL_FORCE: "false"
        DATASOURCES_DEFAULT_HOST: durable_assistants-passbolt-db
        DATASOURCES_DEFAULT_DATABASE: passbolt
        DATASOURCES_DEFAULT_USERNAME: passbolt
        # No mail: people are invited from the command line.
        EMAIL_DEFAULT_FROM: vault@example.com
        EMAIL_TRANSPORT_DEFAULT_HOST: localhost
      secret:
        - DATASOURCES_DEFAULT_PASSWORD:PASSBOLT_DB_PASSWORD
    # Docker starts an empty volume with the image's own ownership (www-data),
    # so Passbolt can write its keys.
    volumes:
      - durable_assistants_passbolt_gpg:/etc/passbolt/gpg
      - durable_assistants_passbolt_jwt:/etc/passbolt/jwt
    cmd: /usr/bin/wait-for.sh -t 0 durable_assistants-passbolt-db:3306 -- /docker-entrypoint.sh

  # Chat: Basecamp's Campfire, unchanged (docs/campfire.md). Its own accounts;
  # agents join as bots.
  campfire:
    image: ghcr.io/basecamp/once-campfire:v1.5.8@sha256:4d92aad32f0a284d0a91d476e33a15be7f73d18a5e3fe2bd061ac891c351594e
    host: server.example.com
    proxy:
      host: chat.example.com
      app_port: 80
      ssl: false
      healthcheck:
        path: /up
    env:
      clear:
        # TLS ends in front of kamal-proxy.
        DISABLE_SSL: "true"
        SKIP_TELEMETRY: "true"
      secret:
        - SECRET_KEY_BASE:CAMPFIRE_SECRET_KEY_BASE
        - VAPID_PRIVATE_KEY:CAMPFIRE_VAPID_PRIVATE_KEY
        - VAPID_PUBLIC_KEY:CAMPFIRE_VAPID_PUBLIC_KEY
    volumes:
      - durable_assistants_campfire:/rails/storage

  # Code: Forgejo, signed in through the install's OpenID Connect provider (an
  # authentication source added once, docs/office.md). SQLite in its volume.
  # No SSH: people push over HTTPS. Actions and the package registry are on.
  code:
    image: codeberg.org/forgejo/forgejo:17.0.1-rootless@sha256:5ef02fbcf22beef56b8c844952ffad58cfe177b6f98e46e6abb5df90b88dc8d3
    host: server.example.com
    proxy:
      host: code.example.com
      app_port: 3000
      ssl: false
      healthcheck:
        path: /api/healthz
    env:
      clear:
        FORGEJO__server__DOMAIN: code.example.com
        FORGEJO__server__ROOT_URL: https://code.example.com/
        FORGEJO__server__DISABLE_SSH: "true"
        FORGEJO__database__DB_TYPE: sqlite3
        FORGEJO__security__INSTALL_LOCK: "true"
        FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
        FORGEJO__service__DISABLE_REGISTRATION: "true"
        FORGEJO__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: "true"
        FORGEJO__service__SHOW_REGISTRATION_BUTTON: "false"
        FORGEJO__openid__ENABLE_OPENID_SIGNIN: "false"
        FORGEJO__openid__ENABLE_OPENID_SIGNUP: "false"
        FORGEJO__oauth2_client__ENABLE_AUTO_REGISTRATION: "false"
        FORGEJO__oauth2_client__USERNAME: email
        FORGEJO__oauth2_client__ACCOUNT_LINKING: login
        FORGEJO__actions__ENABLED: "true"
        FORGEJO__packages__ENABLED: "true"
        FORGEJO__mailer__ENABLED: "false"
      secret:
        - FORGEJO__security__SECRET_KEY:CODE_SECRET_KEY
        - FORGEJO__security__INTERNAL_TOKEN:CODE_INTERNAL_TOKEN
    volumes:
      - durable_assistants_forgejo:/var/lib/gitea
      - durable_assistants_forgejo_config:/etc/gitea

  # The CRM: Twenty, people, companies, deals, notes and tasks. Server and
  # worker share one image and one files volume; Postgres and Redis beside
  # them. Migrations run on the server only.
  crm-db:
    image: docker.io/library/postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    host: server.example.com
    env:
      clear:
        POSTGRES_USER: twenty
        POSTGRES_DB: twenty
      secret:
        - POSTGRES_PASSWORD:CRM_DB_PASSWORD
    volumes:
      - durable_assistants_crm_db:/var/lib/postgresql/data
  crm-redis:
    image: docker.io/library/redis:7@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
    host: server.example.com
    cmd: redis-server --maxmemory-policy noeviction --appendonly yes
    volumes:
      - durable_assistants_crm_redis:/data
  crm:
    image: docker.io/twentycrm/twenty:v2.56.1@sha256:c90565b8a0ea70eb0c0446dcf9491a084140e7f90d8b634e10aa7db381b42f0c
    host: server.example.com
    proxy:
      host: crm.example.com
      app_port: 3000
      ssl: false
      healthcheck:
        path: /healthz
        timeout: 60
    env:
      clear:
        NODE_PORT: "3000"
        SERVER_URL: https://crm.example.com
        REDIS_URL: redis://durable_assistants-crm-redis:6379
        STORAGE_TYPE: local
        # The first person signs up to make the workspace; the address sits
        # behind the install's sign-in page.
        IS_SIGN_UP_DISABLED: "false"
        TELEMETRY_ENABLED: "false"
      secret:
        - PG_DATABASE_URL:CRM_DATABASE_URL
        - APP_SECRET:CRM_APP_SECRET
        - ENCRYPTION_KEY:CRM_ENCRYPTION_KEY
    volumes:
      - durable_assistants_crm_files:/app/packages/twenty-server/.local-storage
  crm-worker:
    image: docker.io/twentycrm/twenty:v2.56.1@sha256:c90565b8a0ea70eb0c0446dcf9491a084140e7f90d8b634e10aa7db381b42f0c
    host: server.example.com
    cmd: yarn worker:prod
    env:
      clear:
        DISABLE_DB_MIGRATIONS: "true"
        DISABLE_CRON_JOBS_REGISTRATION: "true"
        SERVER_URL: https://crm.example.com
        REDIS_URL: redis://durable_assistants-crm-redis:6379
        STORAGE_TYPE: local
        IS_SIGN_UP_DISABLED: "false"
        TELEMETRY_ENABLED: "false"
      secret:
        - PG_DATABASE_URL:CRM_DATABASE_URL
        - APP_SECRET:CRM_APP_SECRET
        - ENCRYPTION_KEY:CRM_ENCRYPTION_KEY
    volumes:
      - durable_assistants_crm_files:/app/packages/twenty-server/.local-storage

  # The wiki: Outline, unchanged, signed in through the install's OpenID
  # Connect provider. Agents reach it through its own MCP server. Postgres and
  # Redis beside it; files in its volume.
  wiki-db:
    image: docker.io/library/postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
    host: server.example.com
    env:
      clear:
        POSTGRES_USER: outline
        POSTGRES_DB: outline
      secret:
        - POSTGRES_PASSWORD:WIKI_DB_PASSWORD
    volumes:
      - durable_assistants_wiki_db:/var/lib/postgresql/data
  wiki-redis:
    image: docker.io/library/redis:7@sha256:a8f08480e1f88f2647fed492d1178c06abb0d0c1fbf02c682a61e2f483fb3954
    host: server.example.com
    volumes:
      - durable_assistants_wiki_redis:/data
  wiki:
    image: docker.io/outlinewiki/outline:1.12.0@sha256:25d6a2ced2f1f0cf03c09abd776d87ba31941ed96d3a99992aa84b3bd0afc074
    host: server.example.com
    proxy:
      host: wiki.example.com
      app_port: 3000
      ssl: false
      healthcheck:
        path: /_health
    env:
      clear:
        URL: https://wiki.example.com
        PORT: "3000"
        # TLS ends in front of kamal-proxy.
        FORCE_HTTPS: "false"
        PGSSLMODE: disable
        REDIS_URL: redis://durable_assistants-wiki-redis:6379
        FILE_STORAGE: local
        OIDC_ISSUER_URL: https://id.example.com
        OIDC_DISPLAY_NAME: Sign in
        OIDC_SCOPES: openid profile email
        DEFAULT_LANGUAGE: en_US
        # Mail out, so an agent can sign in as its own member with a link sent
        # to its address (docs/office.md, "An agent acting as itself"). The
        # install's mail server; on 587 SMTP_SECURE is false and STARTTLS
        # still encrypts. Leave these and the two secrets below out, and the
        # wiki sends no mail and only people sign in.
        SMTP_HOST: smtp.example.com
        SMTP_PORT: "587"
        SMTP_SECURE: "false"
        SMTP_FROM_EMAIL: Wiki <wiki@example.com>
      secret:
        - SECRET_KEY:WIKI_SECRET_KEY
        - UTILS_SECRET:WIKI_UTILS_SECRET
        - DATABASE_URL:WIKI_DATABASE_URL
        - OIDC_CLIENT_ID:WIKI_OIDC_CLIENT_ID
        - OIDC_CLIENT_SECRET:WIKI_OIDC_CLIENT_SECRET
        - SMTP_USERNAME:WIKI_SMTP_USERNAME
        - SMTP_PASSWORD:WIKI_SMTP_PASSWORD
    volumes:
      - durable_assistants_wiki_data:/var/lib/outline/data
