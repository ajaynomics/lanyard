# The Pi Durable sidecar (docs/agent.md). Rails presents sidecar_token to the
# sidecar; the sidecar presents rails_token to Rails. Blank or equal tokens
# refuse every call. Values are JSON-quoted so a token is never read as YAML.
#
# models: the routes a bot may choose, this app's allow-list. The sidecar runs
# any model of a provider it holds a credential for and refuses the rest
# (model_unavailable); the bot's settings offer the models on this list that
# it can run now, each with its own thinking levels (ModelCatalog).
# anthropic/* is the Claude subscription, openai-codex/* the ChatGPT
# subscription, openai/* an OpenAI API key (otherserver has one).
# local/avery-local is a scripted stand-in that costs nothing; the sidecar
# offers it only with AGENT_MODEL_MODE=local.
#
# claude-sonnet-5 is the default because it streams: the 5.5 models hold back
# the answer that follows a tool result and send it in one burst several
# seconds later (anthropics/anthropic-sdk-python#1960, seen here 2026-11-06).
# A bot can still choose a 5.5 model in its settings.
#
# computers: the kinds of computer a bot may use for files and a shell
# (docs/agent.md). local is a directory on this machine, for one trusted
# operator only; sprites is a microVM on Ajay's Sprites platform. The sidecar
# must offer the kind too (AGENT_EXECUTION_MODE; SPRITES_TOKEN and SPRITES_IMAGE).
shared:
  sidecar_url: <%= (Rails.app.creds.option(:pi_durable, :sidecar_url) || "http://127.0.0.1:4397").to_json %>
  sidecar_token: <%= Rails.app.creds.option(:pi_durable, :sidecar_token).to_json %>
  rails_token: <%= Rails.app.creds.option(:pi_durable, :rails_token).to_json %>
  models:
    - anthropic/claude-sonnet-5
    - anthropic/claude-sonnet-5-5
    - anthropic/claude-opus-5-5
    - anthropic/claude-opus-5
    - anthropic/claude-opus-4-8
    - anthropic/claude-haiku-5-5
    - anthropic/claude-sonnet-4-6
    - openai-codex/gpt-6.1-sol
    - openai-codex/gpt-6-sol
    - openai-codex/gpt-6-luna
    - openai-codex/gpt-6.1-terra
    - openai-codex/gpt-6-astra
    - openai-codex/gpt-5.6-sol
    - openai/gpt-6.1-sol
  default_model: anthropic/claude-sonnet-5
  # Comma separated, e.g. "local"; none unless a destination says so.
  computers: <%= Rails.app.creds.option(:pi_durable, :computers).to_s.split(",").map(&:strip).compact_blank.to_json %>

development:
  models:
    - local/avery-local
    - anthropic/claude-sonnet-5
    - anthropic/claude-sonnet-5-5
    - anthropic/claude-opus-5-5
    - anthropic/claude-opus-5
    - anthropic/claude-opus-4-8
    - anthropic/claude-haiku-5-5
    - anthropic/claude-sonnet-4-6
    - openai-codex/gpt-6.1-sol
    - openai-codex/gpt-6-sol
    - openai-codex/gpt-6-luna
    - openai-codex/gpt-6.1-terra
    - openai-codex/gpt-6-astra
    - openai-codex/gpt-5.6-sol
    - openai/gpt-6.1-sol
  default_model: local/avery-local
  computers:
    - local

test:
  models:
    - local/avery-local
    - anthropic/claude-sonnet-5-5
    - openai-codex/gpt-6.1-sol
  default_model: local/avery-local
  computers:
    - local
    - sprites
