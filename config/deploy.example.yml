#       clear:
#         MARIADB_RANDOM_ROOT_PASSWORD: "true"
#         MARIADB_DATABASE: passbolt
#         MARIADB_USER: passbolt
#       secret:
#         - MARIADB_PASSWORD:PASSBOLT_DB_PASSWORD
#     directories:
#       - mysql:/var/lib/mysql
#   passbolt:
#     image: docker.io/passbolt/passbolt:5.17.0-1-ce
#     host: server.example.com
#     # People reach it in their browsers, with Passbolt's extension, and it
#     # may sit behind their sign-in page. The app does not use this address.
#     proxy:
#       host: passwords.example.com
#       app_port: 80
#       ssl: false
#       healthcheck:
#         path: /healthcheck/status
#     env:
#       clear:
#         APP_FULL_BASE_URL: https://passwords.example.com
#         # TLS ends in front of kamal-proxy, as for the app.
#         PASSBOLT_SSL_FORCE: "false"
#         DATASOURCES_DEFAULT_HOST: durable_assistants-passbolt-db
#         DATASOURCES_DEFAULT_DATABASE: passbolt
#         DATASOURCES_DEFAULT_USERNAME: passbolt
#         # No mail: people are invited from the command line.
#         EMAIL_DEFAULT_FROM: passwords@example.com
#         EMAIL_TRANSPORT_DEFAULT_HOST: localhost
