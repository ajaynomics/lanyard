name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

# One job running `bin/ci`, the whole checklist (S5): style, audits, brakeman
# with --exit-on-warn, the Rails and system suites, seeds, and the production
# boot. A check added to bin/ci runs here without touching this file, so the
# two cannot drift apart. test/standards_test.rb fails if this file runs a
# check bin/ci does not own.
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # System tests drive headless Chrome; ApplicationSystemTestCase reads
      # CHROME_BIN and CHROMEDRIVER_PATH.
      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true

      # The backup scripts, and so the backup-and-restore test, drive the
      # sqlite3 command-line tool, which the runner image does not promise.
      - name: Install sqlite3
        run: sudo apt-get update -qq && sudo apt-get install --no-install-recommends -y sqlite3

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Run bin/ci
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
        run: bin/ci

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
