# Concourse, the agents' mail network (docs/design/PARITY.md Round 5). Where it
# is, and where Ajent issues its one-hour tokens (client_credentials, scope
# concourse, resource = the origin). Not secrets: each agent's machine client
# (organization, address, id and secret) comes from Concourse when the person
# joins it (Join Concourse, on the agent's Channels settings) and is kept,
# encrypted, on its ConcourseAgent row.
#
# No default: an install names its own network or has none, and without both
# no agent is offered Concourse (DurableAssistants::Concourse.configured?).
shared:
  origin: <%= Rails.app.creds.option(:concourse, :origin).to_json %>
  token_url: <%= Rails.app.creds.option(:concourse, :token_url).to_json %>

test:
  origin: "https://concourse.example"
  token_url: "https://id.example/oauth/token"
