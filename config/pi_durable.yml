# The optional Pi Durable sidecar (docs/agent.md). Rails presents
# sidecar_token to the sidecar; the sidecar presents rails_token to Rails.
# Blank or equal tokens refuse every call. Values are JSON-quoted so a token
# is never read as YAML.
shared:
  sidecar_url: <%= (Rails.app.creds.option(:pi_durable, :sidecar_url) || "http://127.0.0.1:4397").to_json %>
  sidecar_token: <%= Rails.app.creds.option(:pi_durable, :sidecar_token).to_json %>
  rails_token: <%= Rails.app.creds.option(:pi_durable, :rails_token).to_json %>
