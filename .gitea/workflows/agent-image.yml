# Builds a bot's computer, the Sprite image (Dockerfile.agent), and publishes
# it as gitea.example.com/ajaynomics/durable-assistants-agent:<sha> through Gitea's
# loopback origin, as an existing docs/sprites-developer-cheatsheet.md says
# (never through Cloudflare). The deploy pins the sha (SPRITES_IMAGE).
name: Agent image
on:
  push:
    paths:
      - Dockerfile.agent
      - agent/sprite-relay.mjs
      - agent/guest/**
      - agent/package.json
      - agent/package-lock.json
      - .gitea/workflows/agent-image.yml
  workflow_dispatch:
concurrency:
  group: durable-assistants-agent-image
  cancel-in-progress: true
jobs:
  build:
    runs-on: image-build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Login (loopback origin)
        run: printf '%s' "${{ secrets.REGISTRY_PUSH_TOKEN }}" | docker login 127.0.0.1:33000 -u ajaynomics --password-stdin
      - name: Build and push
        run: |
          ORIGIN=127.0.0.1:33000/ajaynomics/durable-assistants-agent
          DOCKER_BUILDKIT=1 docker build -f Dockerfile.agent -t "$ORIGIN:${{ gitea.sha }}" .
          docker push "$ORIGIN:${{ gitea.sha }}"
      - name: Logout
        if: always()
        run: docker logout 127.0.0.1:33000
