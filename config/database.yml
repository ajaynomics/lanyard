# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
# max_connections caps how many fibers or threads in one process use a
# database at once; it is not a thread count. Under Falcon each request fiber
# leases its own connection, as do Action Cable's workers, and a Solid Queue
# worker needs its threads (config/queue.yml) plus 2 for polling and its
# heartbeat. RAILS_MAX_THREADS keeps Rails' name so an install that already
# sets it still works.
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  primary:
    <<: *default
    database: storage/production.sqlite3
  cache:
    <<: *default
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  # Solid Queue's dispatcher and workers die on "database is locked", and a
  # busy host's disk can stall a commit past 5 s, so they wait longer. Rails
  # passes timeout: to the sqlite3 gem's busy handler, which sleeps between
  # retries, so PRAGMA busy_timeout still reads 0.
  queue:
    <<: *default
    database: storage/production_queue.sqlite3
    timeout: 15000
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
