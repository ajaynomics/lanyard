# Error tracking. Shared GlitchTip.
#
# Optional: without a DSN errors stay in the logs (production_secrets.rb).
# Development and test are null so a stray credential cannot send local errors
# to the production project.
shared:
  dsn: <%= Rails.app.creds.option(:glitchtip, :dsn).to_json %>

development:
  dsn: null

test:
  dsn: null
