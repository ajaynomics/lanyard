# Public origin. Production comes from Kamal (APP__URL), stated once per
# destination; config.hosts and mailer links derive from it.
shared:
  name: <%= Rails.app.creds.option(:app, :name) || "Durable Assistants" %>
  url: <%= Rails.app.creds.option(:app, :url) %>
  # Other hostnames, comma-separated, that only send people to the url.
  redirects: <%= Rails.app.creds.option(:app, :redirects) %>
  mailer_from: <%= Rails.app.creds.option(:app, :mailer_from) || "durable_assistants@localhost" %>
  # The hue of the app's one colour, 0 to 360 (oklch): buttons, the person's
  # messages, the focus ring and the icon's tile. Anything else fails the boot.
  accent_hue: <%= Rails.app.creds.option(:app, :accent_hue) || 255 %>
  # The folder under config/agents a new person's first agent is made from.
  starter_agent: <%= Rails.app.creds.option(:app, :starter_agent) || "assistant" %>
  # "allow": every call that would ask the person's approval runs at once, for
  # every agent (Agent#allows?). Anything else: they ask.
  approvals: <%= Rails.app.creds.option(:app, :approvals) || "ask" %>
  # "true": no call waits for an approval card, not even those that ask every
  # time (Agent#allows?). Each is still recorded in its thread. Off by default.
  approve_everything: <%= Rails.app.creds.option(:app, :approve_everything).to_s == "true" %>

development:
  url: "http://localhost:3000"

# Loopback, which OAuth accepts over plain http for the connectors' callback.
test:
  url: "http://localhost"
