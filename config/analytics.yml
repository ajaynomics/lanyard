# Rybbit, product analytics. The site id and host are
# public identifiers that ship in the HTML, not secrets. A blank site id
# renders no tag, which keeps development and test quiet. One Rybbit site per
# production destination: set RYBBIT__SITE_ID in each config/deploy.<dest>.yml.
#
# Deliberately not a required production secret: analytics must never be able
# to fail a boot.
shared:
  host: <%= Rails.app.creds.option(:rybbit, :host) %>
  site_id: <%= Rails.app.creds.option(:rybbit, :site_id) %>
  # Replay masking hides what people type and the text you mark with rr-mask.
  # Off unless set to true: the install records replays in full. Password
  # fields, where every secret here is pasted, stay masked either way.
  replay_masking: <%= Rails.app.creds.option(:rybbit, :replay_masking) == "true" %>

development:
  site_id:

test:
  site_id:
