# durable-assistants — Kamal 2. Shared base for every destination.
#
# Kamal loads this file and then deep-merges `config/deploy.<destination>.yml`
# over it. Hashes merge by key and arrays are replaced, but there is no
# removal — so `servers:`, `proxy:`, `registry:`, `builder:` and `ssh:` stay
# out of this file. `require_destination: true` makes a bare `kamal deploy`
# raise instead of quietly resolving to whichever destination Kamal finds
# first.
#
# An install copies this file, and config/deploy.example.yml and
# .kamal/secrets.example as config/deploy.<name>.yml and .kamal/secrets.<name>,
# into its own workspace, beside a Dockerfile FROM the published image
# (docs/deployments.md). A destination may set `service:`, `image:` and
# `volumes:` too, to keep the names its running containers already have.
service: durable_assistants
image: durable_assistants

require_destination: true

asset_path: /rails/public/assets

volumes:
  - "durable_assistants_storage:/rails/storage"

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
