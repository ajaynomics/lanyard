# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"
  activerecord:
    attributes:
      # As its General page labels it, so a refusal reads as the row does.
      agent:
        email_name: "Email address"
      # As the agent's Channels label them, so a refusal reads as the form does.
      agent/mail_account:
        address: "Address"
        display_name: "Name"
        smtp_host: "Server"
        smtp_port: "Port"
        imap_host: "Incoming server"
        imap_port: "Incoming port"
        vault_entry: "Saved sign-in"
        forced_bcc: "Always Bcc"
        folder_names: "Folders"
      agent/calendar_server:
        url: "Server"
        vault_entry: "Saved sign-in"
      # A Sprite's size, as the workspace's and the agent's Computer pages label it,
      # and the workspace's own vault user and connector pages.
      computer:
        cpus: "CPUs"
        memory_mib: "Memory"
        disk_mib: "Disk"
      workspace:
        computer_cpus: "CPUs"
        computer_memory_mib: "Memory"
        computer_disk_mib: "Disk"
        passbolt_private_key: "Private key"
        passbolt_passphrase: "Passphrase"
        passbolt_url: "Server"
        voipms_vault_entry: "Its own voip.ms account"
        app_name: "Name"
        accent_hue: "Colour"
      workspace/install_connector:
        url: "Address"
        api_key: "Key"
