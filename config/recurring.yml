#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # Each agent's Concourse mail, and a listener for any that has none (PARITY.md §28).
  concourse_sweep:
    class: ConcourseSweepJob
    schedule: every minute
  # Mail in the install's catch-all box, for the agents it names (docs/email.md).
  email_fetch:
    class: EmailFetchJob
    schedule: every minute
  # The install's connectors, for every person (McpServer.install_for).
  install_connectors:
    class: InstallConnectorsJob
    schedule: every 10 minutes
  # Busy conversations: a lost final frame settles, a stalled run ends (Conversation#recover).
  conversation_recovery:
    class: ConversationRecoveryJob
    schedule: every minute
  # Each agent's routines that are due (Routine).
  routines:
    class: RoutineJob
    schedule: every minute
