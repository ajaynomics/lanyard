# Connectors (docs/connectors.md).
#
# apps: this instance's own OAuth apps. A gallery entry that
# names one signs in with it, unless the person gives their own client ID.
# The secret stays here, never on a connector. The standard's settings scan
# reads two-part keys, so CONNECTORS__GOOGLE__CLIENT_ID is
# connectors.google__client_id in credentials. Google's app is a "Web
# application" client whose redirect URI is <APP__URL>/connectors/callback.
#
# gallery: services a person can add in one click. Each is an MCP server;
# "own_client" means the service offers no dynamic registration, so the person
# pastes the client ID (and secret) of an app they made there, with this app's
# callback address as its redirect URL. An entry with an app asks for one
# only when the instance has none. "scope" is asked for when the server
# advertises none.
shared:
  apps:
    google:
      client_id: <%= Rails.app.creds.option(:connectors, :google__client_id).to_json %>
      client_secret: <%= Rails.app.creds.option(:connectors, :google__client_secret).to_json %>
  gallery:
    linear:
      label: Linear
      url: https://mcp.linear.app/mcp
      description: Issues, projects and comments in your Linear workspace.
    notion:
      label: Notion
      url: https://mcp.notion.com/mcp
      description: Search, read and edit the Notion pages you share with it.
    gmail:
      label: Gmail
      url: https://gmailmcp.googleapis.com/mcp/v1
      description: Search and read your mail, draft replies and send.
      app: google
      scope: https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.compose
    calendar:
      label: Google Calendar
      url: https://calendarmcp.googleapis.com/mcp/v1
      description: Your calendars, free and busy times, and events.
      app: google
      scope: https://www.googleapis.com/auth/calendar.calendarlist.readonly https://www.googleapis.com/auth/calendar.events.freebusy https://www.googleapis.com/auth/calendar.events
    drive:
      label: Google Drive and Docs
      url: https://drivemcp.googleapis.com/mcp/v1
      description: Find and read your files; make Google Docs, and edit and share the ones it made.
      app: google
      scope: https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.readonly
    drive_full:
      label: Google Drive and Docs, every file
      url: https://drivemcp.googleapis.com/mcp/v1
      description: Find, read, edit and share any of your files and Google Docs.
      app: google
      scope: https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/documents
    chat:
      label: Google Chat
      url: https://chatmcp.googleapis.com/mcp/v1
      description: Read your Chat spaces, group chats and direct messages.
      app: google
      scope: https://www.googleapis.com/auth/chat.spaces.readonly https://www.googleapis.com/auth/chat.messages.readonly
    slack:
      label: Slack
      url: https://mcp.slack.com/mcp
      description: Search and send messages in your Slack workspace. Needs your own Slack app.
      own_client: true
    github:
      label: GitHub
      url: https://api.githubcopilot.com/mcp/
      description: Repositories, issues and pull requests. Needs your own GitHub OAuth app.
      own_client: true
    deepwiki:
      label: DeepWiki
      url: https://mcp.deepwiki.com/mcp
      description: Answers about public GitHub repositories. No sign-in.
