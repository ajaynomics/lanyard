# Development keeps the same schedule, so routines and recovery run under bin/jobs.
production: &schedule
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # Each agent's Concourse mail, and a listener for any that has none.
  concourse_sweep:
    class: ConcourseSweepJob
    schedule: every minute
  # Mail in the install's catch-all box, for the agents it names (docs/email.md).
  email_fetch:
    class: EmailFetchJob
    schedule: every minute
  # The install's connectors, for every person (McpServer.install_for).
  install_connectors:
    class: InstallConnectorsJob
    schedule: every 10 minutes
  # Busy conversations: a lost final frame settles, a stalled run ends (Conversation#recover).
  conversation_recovery:
    class: ConversationRecoveryJob
    schedule: every minute
  # What the Share sheet handed over and nobody sent (Share).
  share_sweep:
    class: ShareSweepJob
    schedule: every hour at minute 40
  # Files read from an agent's computer for a call that never used them (Upload).
  upload_sweep:
    class: UploadSweepJob
    schedule: every hour at minute 45
  # Payments whose job was lost, so they still expire and close at Link (PaymentRequest).
  payment_request_sweep:
    class: PaymentRequestSweepJob
    schedule: every 5 minutes
  # Each agent's routines that are due (Routine).
  routines:
    class: RoutineJob
    schedule: every minute

development: *schedule
