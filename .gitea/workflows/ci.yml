name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# One job running `bin/ci`, the whole checklist (S5): style, audits, brakeman
# with --exit-on-warn, the Rails and system suites, seeds, and the production
# boot. A check added to bin/ci runs here without touching this file, so the
# two cannot drift apart. test/standards_test.rb fails if this file runs a
# check bin/ci does not own.
#
# Then, on main only, `publish` builds the two images installs run
# (docs/deployments.md) and pushes them tagged with the commit. It needs `ci`,
# so a commit whose bin/ci failed is never published.
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # The backup scripts, and so the backup-and-restore test, drive the
      # sqlite3 command-line tool, which the runner image does not promise;
      # nor the libraries Chrome loads.
      - name: Install sqlite3 and Chrome's libraries
        run: sudo apt-get update -qq && sudo apt-get install --no-install-recommends -y sqlite3 libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpangocairo-1.0-0 libcairo2 fonts-liberation

      # System tests drive headless Chrome; ApplicationSystemTestCase reads
      # CHROME_BIN and CHROMEDRIVER_PATH.
      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          # An exact version, not "stable": the runners share one tool cache,
          # where a "stable" Chrome and a "stable" driver cached on different
          # days refuse to talk to each other.
          chrome-version: 153.0.8010.36
          install-chromedriver: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Run bin/ci
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
        run: bin/ci

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # The app image (Dockerfile) and an agent's computer (Dockerfile.agent),
  # each tagged with the commit: <owner>/durable-assistants:<sha> and
  # <owner>/durable-assistants-agent:<sha>. An install builds FROM the first
  # and pins the second in SPRITES_IMAGE. Pushed through Gitea's loopback
  # origin, never through Cloudflare, with the job's own token.
  publish:
    needs: ci
    if: gitea.ref == 'refs/heads/main'
    runs-on: image-build
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ${{ gitea.repository }}-publish
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Login (loopback origin)
        run: printf '%s' "${{ secrets.GITEA_TOKEN }}" | docker login 127.0.0.1:33000 -u "${{ gitea.actor }}" --password-stdin
      - name: Build and push
        run: |
          ORIGIN=127.0.0.1:33000/${{ gitea.repository }}
          DOCKER_BUILDKIT=1 docker build -t "$ORIGIN:${{ gitea.sha }}" .
          DOCKER_BUILDKIT=1 docker build -f Dockerfile.agent -t "$ORIGIN-agent:${{ gitea.sha }}" .
          docker push "$ORIGIN:${{ gitea.sha }}"
          docker push "$ORIGIN-agent:${{ gitea.sha }}"
      - name: Logout
        if: always()
        run: docker logout 127.0.0.1:33000
